services:
  postgres:
    image: postgres:16-alpine
    container_name: jusmine-postgres
    environment:
      POSTGRES_USER: jusmine
      POSTGRES_PASSWORD: jusmine
      POSTGRES_DB: jusmine_clinic
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jusmine -d jusmine_clinic"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
